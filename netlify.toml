[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Legacy local MySQL connection labels are not secrets. Imported .env values
  # such as loopback addresses, standard ports and database names cause matches.
  # Passwords, PostgreSQL URLs and APP_SECRET remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "MYSQL_HOST,MYSQL_PORT,MYSQL_USER,MYSQL_DATABASE"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@node-rs/argon2", "pdfkit"]
  included_files = ["!.env", "!.env.*", "!client_secret*.json", "!*.log", "!.local-audio/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"



